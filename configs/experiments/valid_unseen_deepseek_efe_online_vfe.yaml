model_config: ../models/deepseek_reasoner.yaml
environment_config: ../environments/alfworld_textworld.yaml
split: valid_unseen
num_episodes: -1
action_space: admissible
output_dir: results/deepseek_reasoner/valid_unseen_efe_online_vfe

efe:
  progress_weight: 1.0
  information_gain_weight: 0.35
  action_cost_weight: 0.15
  revisit_penalty: 0.25
  horizon_discount: 0.8
  override_margin: 0.10
  max_candidates: 12
  max_location_candidates: 5

# Adapt only QLoRA adapters and structured heads after each real transition.
# The checkpoint is restored at the beginning of every episode.
online_vfe:
  enabled: true
  learning_rate: 0.00001
  beta: 1.0
  state_positive_weight: 10.0
  gradient_clip_norm: 1.0
  steps: 1
